<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OL — Kingdom Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:oklch(0.18 0.012 70);--bg2:oklch(0.21 0.013 70);--panel:oklch(0.24 0.014 72);--panel2:oklch(0.27 0.015 74);--line:oklch(0.34 0.018 74);--line2:oklch(0.40 0.02 76);--ink:oklch(0.95 0.01 80);--ink2:oklch(0.78 0.015 80);--ink3:oklch(0.62 0.015 80);--gold:oklch(0.80 0.13 78);--gold-dim:oklch(0.66 0.10 78);--war:oklch(0.66 0.16 25);}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;}
body{background:radial-gradient(1100px 600px at 78% -8%, oklch(0.26 0.03 78 / .5), transparent 60%),radial-gradient(900px 500px at -5% 8%, oklch(0.24 0.02 300 / .3), transparent 55%),var(--bg);min-height:100vh;}
a{color:var(--gold-dim);}
a:hover{color:var(--gold);}
.ga-veil{min-height:100vh;display:grid;place-items:center;padding:24px;}
.ga-card{width:100%;max-width:380px;background:var(--panel2);border:1px solid var(--line2);border-radius:16px;padding:26px;box-shadow:0 30px 80px oklch(0 0 0 /.55);display:flex;flex-direction:column;gap:12px;}
.ga-title{font-family:"Oswald",sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);margin:0;}
.ga-sub{margin:0 0 6px;color:var(--ink3);font-size:13px;line-height:1.5;}
.ga-offline{font-size:12px;color:var(--gold);background:var(--bg2);border:1px solid oklch(0.5 0.08 78 /.4);border-radius:9px;padding:9px 11px;}
.ga-input{font-family:"JetBrains Mono",monospace;font-size:13.5px;color:var(--ink);background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;outline:none;width:100%;}
.ga-input:focus{border-color:var(--gold-dim);box-shadow:0 0 0 3px oklch(0.66 0.10 78 /.16);}
.ga-input.sm{font-size:13px;padding:9px 10px;}
.ga-btn{font-family:"Oswald",sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.05em;padding:10px 16px;border-radius:9px;cursor:pointer;border:1px solid transparent;}
.ga-btn-primary{background:var(--gold);color:var(--bg);font-weight:600;}
.ga-btn-primary:hover{filter:brightness(1.08);}
.ga-btn-primary:disabled{opacity:.6;cursor:default;}
.ga-err{color:var(--war);font-size:12.5px;}
.ga-err-block{background:oklch(0.66 0.16 25 /.12);border:1px solid var(--war);border-radius:9px;padding:9px 12px;margin-bottom:16px;}
.ga-wrap{max-width:1080px;margin:0 auto;padding:34px 20px 60px;}
.ga-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px;flex-wrap:wrap;}
.ga-h1{font-family:"Oswald",sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.05em;margin:0;}
.ga-h3{font-family:"Oswald",sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);margin:0 0 10px;}
.ga-link{font-family:"Oswald",sans-serif;font-size:13px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
.ga-banner{font-size:12.5px;color:var(--gold);background:var(--bg2);border:1px solid oklch(0.5 0.08 78 /.4);border-radius:9px;padding:11px 13px;margin-bottom:18px;line-height:1.5;}
.ga-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px;margin-bottom:26px;}
.ga-table{width:100%;border-collapse:collapse;min-width:760px;}
.ga-table th{font-family:"Oswald",sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);text-align:left;padding:11px 12px;background:var(--bg2);border-bottom:1px solid var(--line);white-space:nowrap;}
.ga-table td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
.ga-cell{width:100%;font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--ink);background:var(--bg2);border:1px solid var(--line2);border-radius:7px;padding:7px 9px;outline:none;}
.ga-cell:focus{border-color:var(--gold-dim);}
.ga-cell:disabled{opacity:.55;}
.ga-pwcell{min-width:150px;}
.ga-id{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--gold);background:oklch(0.7 0.1 78 /.12);border:1px solid oklch(0.7 0.1 78 /.25);padding:3px 7px;border-radius:6px;}
.ga-copylink{display:block;margin-top:5px;font-size:11px;font-family:"JetBrains Mono",monospace;white-space:nowrap;}
.ga-actions{display:flex;gap:6px;white-space:nowrap;}
.ga-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:var(--panel);border:1px solid var(--line2);color:var(--ink2);cursor:pointer;font-size:13px;}
.ga-icon:hover{background:var(--panel2);color:var(--ink);}
.ga-icon.ga-danger:hover{background:oklch(0.66 0.16 25 /.18);color:var(--war);border-color:var(--war);}
.ga-empty{color:var(--ink3);font-style:italic;text-align:center;padding:20px;}
.ga-new{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:18px 20px;}
.ga-new-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.ga-new-row .ga-input{flex:1;min-width:160px;}
.ga-hint{font-size:12px;color:var(--ink3);margin:10px 0 0;}
.ga-foot{margin-top:26px;font-size:12px;color:var(--ink3);line-height:1.6;}
.ga-foot code{color:var(--ink2);}
</style>
</head>
<body>
<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

  <text x="50" y="59" font-family="Oswald, sans-serif" font-weight="700" font-size="17" fill="#241c12" text-anchor="middle">ADM</text>
</svg>
</template>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="assets/cloud.js"></script>
<script type="text/babel" src="assets/admin.jsx"></script>
</body>
</html>
